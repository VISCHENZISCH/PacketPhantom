[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "packetphantom"
dynamic = ["version"]
description = "Analyseur réseau temps réel : cœur Rust, TUI, API REST et tableau de bord web, détection de menaces."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["scapy>=2.6.0", "textual>=8.0.0", "rich>=13.0.0", "requests>=2.28.0", "cryptography>=42"]

[project.optional-dependencies]
geoip = ["maxminddb>=2.4.0"]
dev = ["pytest>=8.0", "maturin>=1.7"]

[project.scripts]
packetphantom = "packetphantom.cli:main"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "packetphantom._core"
python-source = "."
python-packages = ["packetphantom"]
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
